<?xml version="1.0" encoding="UTF-8"?>
<!-- Lux 图标（0.7 重绘）
     lux = 拉丁语"光"。构图取"一束穿过轨道的 λ"：
     干净的几何笔画、克制的辉光、冷调渐变，去掉旧版的碎点与多重光晕，
     让图标在 16px 到 512px 都保持清晰。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
     width="512" height="512" role="img" aria-label="Lux">
  <defs>
    <!-- 背景：深空靛蓝，左上偏亮、右下偏紫 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0a0f22"/>
      <stop offset="0.48" stop-color="#101331"/>
      <stop offset="1"   stop-color="#1b143f"/>
    </linearGradient>

    <!-- 左上角高光，制造玻璃质感 -->
    <radialGradient id="sheen" cx="0.2" cy="0.12" r="0.75">
      <stop offset="0"   stop-color="#8fd8ff" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#6f8dff" stop-opacity="0.07"/>
      <stop offset="1"   stop-color="#6f8dff" stop-opacity="0"/>
    </radialGradient>

    <!-- λ 主光：青 → 蓝 → 紫 -->
    <linearGradient id="beam" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0"   stop-color="#7df3ff"/>
      <stop offset="0.48" stop-color="#6ea8fe"/>
      <stop offset="1"   stop-color="#b69cff"/>
    </linearGradient>

    <!-- 轨道描边渐变 -->
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#67e8f9"/>
      <stop offset="1"   stop-color="#a78bfa"/>
    </linearGradient>

    <!-- 内描边高光（细边框） -->
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- 柔和外辉光（只给 λ 主笔画用一次） -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 细网格：更疏、更淡，只作质感 -->
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#9fb4ff"
            stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#grid)"/>
  <rect width="512" height="512" rx="116" fill="url(#sheen)"/>

  <!-- 轨道：一条主环 + 一条内环，留缺口以示"轨迹" -->
  <g fill="none" stroke="url(#orbit)" stroke-linecap="round">
    <ellipse cx="256" cy="256" rx="190" ry="72"
             stroke-opacity="0.38" stroke-width="3"
             stroke-dasharray="250 46 120 60"
             transform="rotate(-24 256 256)"/>
    <ellipse cx="256" cy="256" rx="158" ry="88"
             stroke-opacity="0.22" stroke-width="2"
             stroke-dasharray="180 40 90 60"
             transform="rotate(38 256 256)"/>
  </g>

  <!-- 轨道上的光节点 -->
  <g>
    <circle cx="398" cy="182" r="8"   fill="#ffd479"/>
    <circle cx="398" cy="182" r="14"  fill="#ffd479" fill-opacity="0.16"/>
    <circle cx="142" cy="322" r="6"   fill="#7df3ff"/>
    <circle cx="142" cy="322" r="11"  fill="#7df3ff" fill-opacity="0.16"/>
  </g>

  <!-- λ 主笔画：外辉光 + 实心渐变 + 内高光 -->
  <g filter="url(#glow)">
    <path d="M199 124 L256 236 L327 392"
          fill="none" stroke="url(#beam)" stroke-width="34"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 236 L171 392"
          fill="none" stroke="url(#beam)" stroke-width="34"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="none" stroke="#eef9ff" stroke-opacity="0.75"
     stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M207 141 L254 230 L315 372"/>
    <path d="M252 233 L183 369"/>
  </g>

  <!-- 交点星芒：强调 λ 的顶点 -->
  <g transform="translate(256 236)" fill="#eafcff">
    <path d="M0 -18 L3.4 -3.4 L18 0 L3.4 3.4 L0 18 L-3.4 3.4 L-18 0 L-3.4 -3.4 Z"
          fill-opacity="0.92"/>
  </g>

  <!-- 底部投影，把 λ 放回轨道平面 -->
  <ellipse cx="252" cy="404" rx="92" ry="11"
           fill="#5b8cff" fill-opacity="0.16"/>

  <!-- 内描边，收住边缘 -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5"
        fill="none" stroke="url(#hair)" stroke-width="3"/>
</svg>
